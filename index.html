<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fashion Store | Exclusive Access</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div id="auth-container">
        <div class="auth-box">
            <h2>Bem-vindo à Fashion Store</h2>
            <p>Cadastre-se para acessar nossa coleção exclusiva.</p>
            <form id="register-form">
                <input type="text" placeholder="Nome Completo" required>
                <input type="email" placeholder="E-mail" required>
                <input type="password" placeholder="Senha" required>
                <button type="submit">Criar Conta</button>
            </form>
        </div>
    </div>

    <div id="shop-content" style="display: none;">
        <header>
            <h1>Fashion Store</h1>
            <nav>
                <span>Olá, <strong id="user-name">Usuário</strong></span>
            </nav>
        </header>

        <section class="products">
            <div class="product-card">
                <div class="img-placeholder"></div>
                <h3>Camiseta Oversized</h3>
                <p>R$ 89,90</p>
                <button>Comprar</button>
            </div>
            <div class="product-card">
                <div class="img-placeholder"></div>
                <h3>Jaqueta Jeans</h3>
                <p>R$ 199,90</p>
                <button>Comprar</button>
            </div>
        </section>
    </div>

    <script src="script.js"></script>
</body>
</html>
