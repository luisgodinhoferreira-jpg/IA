<main id="shop-content" style="display: none;">
    <nav class="navbar">
        <div class="logo">A<span>M</span></div>
        <div class="nav-info">
            <span id="user-display">CLIENTE</span>
        </div>
        <div class="cart-icon" onclick="toggleCart()">
            SACOLA (<span id="cart-count">0</span>)
        </div>
    </nav>

    <div id="cart-sidebar" class="sidebar">
        <div class="sidebar-header">
            <h2>Sua Sacola</h2>
            <button onclick="toggleCart()">X</button>
        </div>
        <div id="cart-items">
            </div>
        <div class="sidebar-footer">
            <div class="total">Total: <span id="cart-total">R$ 0,00</span></div>
            <button class="btn-glow" onclick="goToCheckout()">FINALIZAR COMPRA</button>
        </div>
    </div>

    <section id="checkout-section" style="display: none; padding: 120px 5%;">
        <h1>Finalizar Compra</h1>
        <div class="checkout-container">
            <form id="checkout-form">
                <h3>1. Entrega</h3>
                <input type="text" placeholder="CEP" required>
                <input type="text" placeholder="Endereço e Número" required>
                
                <h3>2. Pagamento</h3>
                <select required>
                    <option value="">Selecione o método</option>
                    <option value="pix">Pix (5% OFF)</option>
                    <option value="cartao">Cartão de Crédito</option>
                </select>
                <input type="text" placeholder="Número do Cartão" id="card-info" style="display:none">
                
                <button type="submit" class="btn-glow">CONFIRMAR PEDIDO</button>
            </form>
        </div>
    </section>

    <div id="products-view">
        <header class="shop-hero">
            <h2>NOVIDADES</h2>
        </header>
        <div class="product-grid" id="grid"></div>
    </div>
</main>
