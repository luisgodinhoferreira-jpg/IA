<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ARQUIVO MODERNO | Oficial</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div id="auth-screen" class="full-screen">
        <div class="auth-card">
            <h1>ARQUIVO<br>MODERNO</h1>
            <p>Acesso exclusivo para membros.</p>
            <form id="login-form">
                <input type="text" id="user-input" placeholder="Nome Completo" required>
                <input type="email" placeholder="E-mail" required>
                <button type="submit">ENTRAR NA LOJA</button>
            </form>
        </div>
    </div>

    <main id="shop-screen" class="hidden">
        <nav class="navbar">
            <div class="logo">AM</div>
            <div class="user-info">Olá, <span id="client-name">...</span></div>
            <div class="cart-btn" onclick="toggleCart()">SACOLA (<span id="cart-num">0</span>)</div>
        </nav>

        <section class="products-grid" id="product-container"></section>
    </main>

    <aside id="cart-sidebar" class="sidebar">
        <div class="sidebar-header">
            <h3>Sua Sacola</h3>
            <button onclick="toggleCart()">FECHAR</button>
        </div>
        <div id="cart-list"></div>
        <div class="sidebar-footer">
            <p>Total: <strong id="total-price">R$ 0,00</strong></p>
            <button onclick="showCheckout()">FINALIZAR COMPRA</button>
        </div>
    </aside>

    <div id="checkout-screen" class="full-screen hidden">
        <div class="checkout-box">
            <h2>Finalizar Pedido</h2>
            <div class="checkout-form">
                <input type="text" placeholder="CEP">
                <input type="text" placeholder="Endereço">
                <select>
                    <option>Cartão de Crédito (10x)</option>
                    <option>Pix (Desconto de 5%)</option>
                </select>
                <button onclick="finishOrder()">CONFIRMAR PAGAMENTO</button>
                <button class="back-btn" onclick="hideCheckout()">Voltar</button>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
