<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MODERN ARCHIVE | Premium Wear</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;800&display=swap" rel="stylesheet">
</head>
<body>

    <div id="auth-container">
        <div class="floating-shapes">
            <div class="shape s1"></div>
            <div class="shape s2"></div>
        </div>
        
        <div class="auth-card" id="tilt-card">
            <div class="card-content">
                <span class="tag">EST. 2024</span>
                <h1>MODERN<br>ARCHIVE</h1>
                <p>Acesse o catálogo restrito de peças exclusivas.</p>
                
                <form id="register-form">
                    <div class="input-group">
                        <input type="text" id="name-input" placeholder=" " required>
                        <label>Nome Completo</label>
                    </div>
                    <div class="input-group">
                        <input type="email" placeholder=" " required>
                        <label>E-mail Corporativo</label>
                    </div>
                    <button type="submit" class="btn-glow">DESBLOQUEAR ACESSO</button>
                </form>
            </div>
        </div>
    </div>

    <main id="shop-content" style="display: none;">
        <nav class="navbar">
            <div class="logo">M<span>A</span></div>
            <div class="nav-info">
                <span>COLLECTION_001</span>
                <span id="user-display">CLIENTE</span>
            </div>
            <div class="cart-icon">BAG (0)</div>
        </nav>

        <header class="shop-hero">
            <h2>NEW ARRIVALS</h2>
            <p>Drop limitado. Peças numeradas.</p>
        </header>

        <div class="product-grid" id="grid">
            </div>
    </main>

    <script src="script.js"></script>
</body>
</html>
